[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "social-auto-upload"
version = "0.1.0"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "biliup>=0.4.098",
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92,<5",
  "patchright==1.61.2",
  "Pillow>=10.2.0",
  "PyYAML>=6.0.2",
  "qrcode==8.2",
  "requests==2.34.2",
  "segno>=1.6.6",
  "yt-dlp>=2024.1.0",
]

[project.scripts]
sau = "sau_cli:main"
sau-worker = "web_runner.worker:main"

[project.optional-dependencies]
web = [
  "Flask[async]==3.1.1",
  "aiohttp>=3.9.5",
  "aiohttp-cors>=0.8.1",
  "flask-cors==6.0.0",
  "websocket-client>=1.8.0",
  "Authlib>=1.3.0",
  "psycopg[binary]>=3.2,<3.4",
  "psycopg-pool>=3.2,<3.4",
  "waitress>=3.0.0",
]
web-pg = [
  "social-auto-upload[web]",
]
media = [
  "moviepy>=2.0.0",
  "imageio-ffmpeg>=0.5.0",
  "scenedetect>=0.6.4",
  "faster-whisper>=1.0.0",
  # stable-ts: reliable Whisper timestamps + SRT regroup (word-level / silence / punct)
  # whisperless variant avoids pulling openai-whisper; uses faster-whisper backend.
  "stable-ts-whisperless>=2.19.0",
  "deep-translator>=1.11.4",
]

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["cli_main", "conf", "sau_cli"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["cli*", "uploader*", "utils*", "myUtils*", "web_runner*", "crawler*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "social-auto-upload[web]",
  "black>=24.0.0",
  "isort>=5.13.0",
  "ruff>=0.4.0",
]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120
known_first_party = ["cli", "uploader", "utils"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["cli", "uploader", "utils"]
