<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SAU Shell — multi-platform video publisher" />
    <title>sau@main</title>
    <!-- Fonts: IBM Plex Sans (display + body) + IBM Plex Mono (code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,opsz,wght@0,7..80,400;0,7..80,500;0,7..80,600;0,7..80,700;1,7..80,400&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <script>
      (function() {
        try {
          var theme = localStorage.getItem('sau-ui-theme') || 'system';
          if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
