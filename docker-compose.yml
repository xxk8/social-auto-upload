version: "3.8"

# ── social-auto-upload Docker Compose ──────────────────────────────
# One-command start for new contributors:
#
#   docker compose up -d
#
# Starts PostgreSQL 16 + the web backend on port 6001.
# The database is auto-initialised on first startup (init_db() in
# web_runner/db.py runs when create_app() is called).
#
# For local frontend development, run the Vite dev server separately:
#   cd sau_web/frontend && npm run dev
# The Vite proxy forwards /api/* to http://localhost:6001.
#
# Environment variables:
#   SAU_AUTH_ENABLED   set to "true" to require login (default: false)
#   SAU_SECRET_KEY     Flask session signing key (auto-generated if absent)
# ───────────────────────────────────────────────────────────────────

services:
  # ── PostgreSQL 16 ────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-admin123}
      POSTGRES_DB: ${PG_DB:-sau}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-sau}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Python Flask Backend ─────────────────────────────────────────
  backend:
    build: .
    restart: unless-stopped
    ports:
      - "6001:6001"
    environment:
      # Database — hostname is the service name "db", not 127.0.0.1
      DATABASE_URL: postgres://${PG_USER:-postgres}:${PG_PASSWORD:-admin123}@db:5432/${PG_DB:-sau}
      # CORS: allow Vite dev server + production origin
      SAU_CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:5174"
      # Auth disabled by default (no email/password setup needed for local dev)
      SAU_AUTH_ENABLED: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploads across restarts
      - sau_uploads:/app/.sau_uploads

volumes:
  pgdata:
  sau_uploads:

networks:
  default:
    name: sau-network
